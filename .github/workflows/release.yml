name: Release

# Runs when core's package.json changes on main. Publishes the version to npm (trusted publishing,
# with provenance) and to GitHub Packages; a registry that already has the version is skipped.
on:
  push:
    branches: [main]
    paths: [packages/core/package.json]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: check
        run: |
          # GitHub Packages gets its own config; npm reads the token from the environment, never from the file
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/github.npmrc"
          version=$(node -p "require('./packages/core/package.json').version")
          if curl -sf "https://registry.npmjs.org/@xlsxflow%2fcore/$version" >/dev/null; then echo "npm already has $version"; else echo "npm=true" >> "$GITHUB_OUTPUT"; fi
          if npm view "@xlsxflow/core@$version" version --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/github.npmrc" 2>/dev/null | grep -qx "$version"; then echo "GitHub Packages already has $version"; else echo "github=true" >> "$GITHUB_OUTPUT"; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.npm || steps.check.outputs.github
        run: pnpm install --frozen-lockfile --filter @xlsxflow/core
      - if: steps.check.outputs.npm || steps.check.outputs.github
        run: pnpm test && pnpm pack
        working-directory: packages/core
      - if: steps.check.outputs.npm
        run: npm publish xlsxflow-core-*.tgz --access public --provenance
        working-directory: packages/core
      - if: steps.check.outputs.github
        run: npm publish xlsxflow-core-*.tgz --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/github.npmrc"
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
