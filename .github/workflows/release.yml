name: Release

# Runs when core's package.json changes on main. Publishes the version to npm (trusted publishing,
# with provenance) and to GitHub Packages; a registry that already has the version is skipped.
on:
  push:
    branches: [main]
    paths: [packages/core/package.json]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: check
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          version=$(node -p "require('./packages/core/package.json').version")
          if curl -sf "https://registry.npmjs.org/@xlsxflow%2fcore/$version" >/dev/null; then echo "npm already has $version"; else echo "npm=true" >> "$GITHUB_OUTPUT"; fi
          if npm view "@xlsxflow/core@$version" version --registry https://npm.pkg.github.com 2>/dev/null | grep -qx "$version"; then echo "GitHub Packages already has $version"; else echo "github=true" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.npm || steps.check.outputs.github
        run: pnpm install --frozen-lockfile --filter @xlsxflow/core
      - if: steps.check.outputs.npm || steps.check.outputs.github
        run: pnpm test && pnpm pack
        working-directory: packages/core
      - if: steps.check.outputs.npm
        run: npm publish xlsxflow-core-*.tgz --access public --provenance
        working-directory: packages/core
      - if: steps.check.outputs.github
        run: npm publish xlsxflow-core-*.tgz --registry https://npm.pkg.github.com
        working-directory: packages/core
