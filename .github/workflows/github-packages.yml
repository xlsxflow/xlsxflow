name: Publish to GitHub Packages

# Runs when core's package.json changes on main; a version already in GitHub Packages is skipped
on:
  push:
    branches: [main]
    paths: [packages/core/package.json]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@xlsxflow'
      - id: check
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if npm view "@xlsxflow/core@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$version is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile --filter @xlsxflow/core
      - if: steps.check.outputs.skip != 'true'
        run: pnpm test
        working-directory: packages/core
      - if: steps.check.outputs.skip != 'true'
        run: pnpm pack
        working-directory: packages/core
      - if: steps.check.outputs.skip != 'true'
        run: npm publish xlsxflow-core-*.tgz --registry https://npm.pkg.github.com
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
