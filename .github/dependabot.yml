version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # majors (vitest, TypeScript, @types/node kept at the oldest supported Node) are upgraded by hand
      - dependency-name: '*'
        update-types: [version-update:semver-major]
